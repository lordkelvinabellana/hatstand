name: Compatibility result
description: Share a test result for a Claude Desktop version or feature
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: Follow the checklist in docs/COMPATIBILITY.md. Report pass or fail only; no emails, names, or screenshots of private content.
  - type: input
    id: claude
    attributes:
      label: Claude Desktop version and install type
    validations:
      required: true
  - type: input
    id: hatstand
    attributes:
      label: Hatstand version
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      placeholder: |
        Reboot persistence: pass
        Sign-out isolation: pass
        Cowork separation: not tested
    validations:
      required: true
