version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Node.js major version the app targets (see engines).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      electron-forge:
        patterns: ['@electron-forge/*', '@electron/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
